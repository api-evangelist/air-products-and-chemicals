notes: >-
  Nothing is served at any /.well-known/ path on any Air Products host. Every host answers with a
  catch-all body (Sitecore 404 page on www, an nginx 301 on the apex, a Drupal 404 shell on investors,
  an empty 404 on account) so no probe returned a document worth saving, and NO WellKnown or SecurityTxt
  pointer is emitted for this provider. A soft-404 control path was probed on each host and returned the
  same body and byte count as the real /.well-known/ paths, confirming the 404s are genuine absences and
  not a blocked crawler.
  The one substantive discovery on this sweep is api.airproducts.com — a live Axway (Vordel) API Gateway.
  Every path on that host, including "/", returns HTTP 404 with content-type application/soap+xml and a
  SOAP 1.2 fault whose subcode is fault:MessageBlocked in the http://www.vordel.com/soapfaults namespace.
  That is a real B2B/partner integration surface operated by Air Products, but it publishes no WSDL, no
  service listing and no discovery document to an unauthenticated caller; ?wsdl and ?singleWsdl are
  blocked identically. It is recorded here as evidence, not registered as an API entry, because no Air
  Products document names it as a base URL.
