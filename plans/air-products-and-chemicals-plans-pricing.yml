description: Air Products is a global industrial-gas and process-technology supplier (hydrogen, oxygen,
  nitrogen, helium, LNG technology, gasification). It does not publish a public developer or API rate
  card; product is sold under long-term gas-supply, on-site, or merchant-tank contracts. Customer
  digital integrations (e.g., MyAirProducts portal, telemetry on customer-site tanks, scheduling) are
  provisioned as part of those supply agreements.
notes: No public API pricing. Air Products bills on industrial-gas product, equipment, and service —
  not API calls.
sources:
  - https://www.airproducts.com/
plan_count: 0
# 2026-08-30 enrichment pass: verified by probe that Air Products publishes NO pricing or plans page.
# www.airproducts.com/pricing and /plans are not in the sitemap; the only commercial surface is the
# MyAirProducts online-ordering portal, which sits behind account.airproducts.com/login (HTTP 200 login
# wall). plan_count is 0 because nothing priced is published; the single entry below records the
# contract SHAPE Air Products sells under, not a published rate card.
evidence:
  - url: https://www.airproducts.com/sitemap.xml
    status: 200
    finding: 1,174 URLs, none of them a pricing or plans page
  - url: https://apdirect.airproducts.com/
    status: 200
    finding: redirects to https://account.airproducts.com/login - ordering and any pricing is customer-only
  - url: https://www.airproducts.com/legal-documents/terms-and-conditions-for-myairproducts-online-ordering-current-customers
    status: 200
    finding: online-ordering terms confirm ordering is for existing contracted customers
